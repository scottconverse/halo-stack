llm-pi-ai:
  providers:
    lmstudio:
      # permanent id — sessions embed it, never rename
      displayName: LM Studio (HALO)
      api: openai-completions
      baseURL: http://127.0.0.1:1234/v1
      apiKeyEnv: LMSTUDIO_API_KEY
      compat:
        thinkingFormat: qwen
        supportsReasoningEffort: true
      reasoning: medium # Qwen 3.8 defaults to xhigh and overthinks (Willison 2026-08-16)
      models:
        - id: qwen/qwen3.8-27b
          name: Qwen3.8 27B Q5 — daily brain
          contextWindow: 65536
          # 49152: length cap only — zero speed/memory cost. Effective limit
          # is always min(cap, room left in the 65,536 context window), so
          # this setting means "config is never the limit; the window is."
          # History: 8192/16384/24576 all truncated creator-mode plugin
          # emits mid-source (2026-08-18). Only residual purpose of a cap:
          # circuit-breaker on a pathological generation loop.
          maxTokens: 49152
          input: [ text, image ]
          reasoningEfforts:
            low: low
            medium: medium
            # model has no real "high" tier (low/medium/xhigh only); xhigh burns
            # 17-22K thinking tokens/turn on this box — opt-in via xhigh only
            high: medium
            xhigh: xhigh
        - id: qwen3-coder-30b-a3b-instruct
          name: Qwen3 Coder 30B MoE — on-demand worker
          contextWindow: 32768
          maxTokens: 8192
ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
agent-presets:
  default: halo-standard
