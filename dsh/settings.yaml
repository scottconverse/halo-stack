llm-pi-ai:
  providers:
    lmstudio:
      # permanent id — sessions embed it, never rename
      displayName: LM Studio (HALO)
      api: openai-completions
      baseURL: http://127.0.0.1:1234/v1
      apiKeyEnv: LMSTUDIO_API_KEY
      # Default is 300000 (5 min) — sized for a small window. It is now SHORTER
      # than a healthy first token at depth: measured TTFT on this box 2026-08-20
      # was 259s / 362s / 403s on ordinary review turns. The adapter was killing
      # live requests, retrying, and re-prefilling the whole context each time
      # (one session burned 2.4M input tokens on a single turn). Raised to cover
      # worst-case prefill of a nearly-full 131,072 window.
      streamIdleTimeoutMs: 1200000
      compat:
        thinkingFormat: qwen
        supportsReasoningEffort: true
      reasoning: medium # Qwen 3.8 defaults to xhigh and overthinks (Willison 2026-08-16)
      models:
        - id: qwen/qwen3.8-27b
          name: Qwen3.8 27B Q5 — daily brain
          # 131072 adopted 2026-08-19 (bench-window-131k.md): KV q8_0 halves
          # KV bytes, so the doubled window costs the same GPU footprint as
          # the old 65536/f16 config, decode parity proven to 110K depth.
          contextWindow: 131072
          # 49152: length cap only — zero speed/memory cost. Effective limit
          # is always min(cap, room left in the 131,072 context window), so
          # this setting means "config is never the limit; the window is."
          # History: 8192/16384/24576 all truncated creator-mode plugin
          # emits mid-source (2026-08-18). Only residual purpose of a cap:
          # circuit-breaker on a pathological generation loop.
          maxTokens: 49152
          input: [ text, image ]
          reasoningEfforts:
            low: low
            medium: medium
            # model has no real "high" tier (low/medium/xhigh only); xhigh burns
            # 17-22K thinking tokens/turn on this box — opt-in via xhigh only
            high: medium
            xhigh: xhigh
        - id: qwen3-coder-30b-a3b-instruct
          name: Qwen3 Coder 30B MoE — on-demand worker
          contextWindow: 32768
          maxTokens: 8192
ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
agent-presets:
  default: halo-standard

# Compaction budgets, retuned for the 131,072 window (2026-08-20).
#
# The stock defaults (threshold 0.8, retain 0.16, summary maxTokens 8192) were
# sized for a small window. At 131,072 they ask the summarizer to fold ~84,000
# tokens into 8,192 — 10:1. It cannot, so every checkpoint returned
# "summarization truncated at the token cap (incomplete checkpoint)", context
# never actually shrank, the session immediately re-crossed the threshold, and
# it compacted forever. Measured: 5 consecutive failed compactions in ONE turn,
# 11.5 / 13.5 / 16.6 / 20.1 minutes each, ~95 minutes of pure treadmill.
#
# Raising maxTokens alone makes it WORSE: the brain decodes at ~11 tok/s, so
# summary LENGTH is what costs the minutes (8192 tok ≈ 12 min — which is
# exactly the observed compaction time). The fix is to shrink what must be
# summarized, not to grow the summary:
#   threshold 98,304  - retain 65,536  = 32,768 to summarize, into 12,288 (2.7:1)
# Achievable in one pass, ~18 min worst case, and it actually completes.
#
# Compaction remains expensive at this window by nature. Treat it as a safety
# net, not a workflow: bound work so it never fires (pipeline\run.ps1).
#
# retainRatio, NOT retainTokens: an absolute 65536 would exceed the 5070Ti
# box's entire 40,448 window, so retain would be >= threshold and its deploy
# would break. A ratio scales to whatever window the machine actually has
# (HALO 131,072 -> retain 65,536; 5070Ti 32,768 -> retain 16,384). See #39.
compaction-basic:
  thresholdRatio: 0.75
  retainRatio: 0.5
  maxTokens: 12288
  compactionRetries: 2
